services:
  cryptobuch:
    build: .
    container_name: cryptobuch
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      # Diese Werte dienen beim allerersten Start als Vorgaben. Danach werden sie
      # sicher pro Installation in der UI unter „Einstellungen“ verwaltet.
      # 0 = alle vom Explorer bereitgestellten Transaktionen laden
      MAX_TRANSACTIONS_PER_SYNC: ${MAX_TRANSACTIONS_PER_SYNC:-0}
      # Optionaler eigener Esplora-kompatibler Endpunkt; standardmäßig Blockstream.
      BITCOIN_EXPLORER_BASE_URL: ${BITCOIN_EXPLORER_BASE_URL:-https://blockstream.info/api}
      TZKT_API_BASE_URL: ${TZKT_API_BASE_URL:-https://api.tzkt.io/v1}
      # TronGrid liefert bestätigte native TRX-Transfers. Ein API-Key ist optional,
      # aber für größere Portfolios wegen der öffentlichen Rate Limits empfohlen.
      TRONGRID_BASE_URL: ${TRONGRID_BASE_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      # Blockfrost liefert die Cardano-Transaktionshistorie. Die Project-ID ist
      # beim ersten Start optional, wird für Cardano-Wallets aber benötigt.
      BLOCKFROST_BASE_URL: ${BLOCKFROST_BASE_URL:-https://cardano-mainnet.blockfrost.io/api/v0}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:-}
      # Etherscan API V2 liefert native ETH- sowie ERC-20-Transfers.
      ETHERSCAN_API_BASE_URL: ${ETHERSCAN_API_BASE_URL:-https://api.etherscan.io/v2/api}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      # Ausschließlich read-only für ERC-20-Contract-Metadaten via viem.
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://cloudflare-eth.com}
      # Weitere Netzwerke verwenden bewusst eigene Explorer-/Indexerdienste.
      BSCSCAN_API_BASE_URL: ${BSCSCAN_API_BASE_URL:-https://api.bscscan.com/api}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
      SNOWTRACE_API_BASE_URL: ${SNOWTRACE_API_BASE_URL:-https://api.snowtrace.io/api}
      SNOWTRACE_API_KEY: ${SNOWTRACE_API_KEY:-}
      SOLSCAN_API_BASE_URL: ${SOLSCAN_API_BASE_URL:-https://pro-api.solscan.io/v2.0}
      SOLSCAN_API_KEY: ${SOLSCAN_API_KEY:-}
      XRPL_RPC_URL: ${XRPL_RPC_URL:-https://xrplcluster.com/}
      STELLAR_HORIZON_BASE_URL: ${STELLAR_HORIZON_BASE_URL:-https://horizon.stellar.org}
      NEARBLOCKS_API_BASE_URL: ${NEARBLOCKS_API_BASE_URL:-https://api.nearblocks.io/v1}
      NEARBLOCKS_API_KEY: ${NEARBLOCKS_API_KEY:-}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io/v2}
      TONAPI_KEY: ${TONAPI_KEY:-}
      BLOCKCYPHER_API_BASE_URL: ${BLOCKCYPHER_API_BASE_URL:-https://api.blockcypher.com/v1}
      BLOCKCYPHER_API_TOKEN: ${BLOCKCYPHER_API_TOKEN:-}
      BLOCKCHAIR_API_BASE_URL: ${BLOCKCHAIR_API_BASE_URL:-https://api.blockchair.com}
      BLOCKCHAIR_API_KEY: ${BLOCKCHAIR_API_KEY:-}
      COINGECKO_API_BASE_URL: ${COINGECKO_API_BASE_URL:-https://api.coingecko.com/api/v3}
      # Kostenloser EUR-Kerzen-Fallback für historische native Coin-Kurse.
      BITVAVO_API_BASE_URL: ${BITVAVO_API_BASE_URL:-https://api.bitvavo.com/v2}
      # Für nicht verfügbare Märkte und historische ERC-20-Kurse kann CoinGecko Pro nötig sein.
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      # Die automatische Preisergänzung ist gedrosselt und verarbeitet kleine Batches.
      HISTORICAL_PRICE_RETRY_INTERVAL_MINUTES: ${HISTORICAL_PRICE_RETRY_INTERVAL_MINUTES:-15}
      HISTORICAL_PRICE_BACKFILL_BATCH_SIZE: ${HISTORICAL_PRICE_BACKFILL_BATCH_SIZE:-60}
      # Exakt so benannte, vertrauenswürdige TzKT-Payout-Konten werden automatisch als Staking markiert.
      XTZ_STAKING_PAYOUT_ALIASES: ${XTZ_STAKING_PAYOUT_ALIASES:-Stake.fish Payouts}
      # BIP44-Scan für Bitcoin-xPubs: 20 aufeinanderfolgende unbenutzte Adressen pro Zweig.
      XPUB_GAP_LIMIT: ${XPUB_GAP_LIMIT:-20}
      XPUB_MAX_DERIVATIONS_PER_BRANCH: ${XPUB_MAX_DERIVATIONS_PER_BRANCH:-200}
    volumes:
      - cryptobuch_data:/data
    restart: unless-stopped

volumes:
  cryptobuch_data:
